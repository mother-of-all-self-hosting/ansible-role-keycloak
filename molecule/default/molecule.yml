---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: keycloak-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        keycloak_debug_service_enabled: false

        # Variables for Keycloak
        keycloak_uid: 1000
        keycloak_gid: 1000
        keycloak_scheme: http
        keycloak_hostname: localhost
        keycloak_container_labels_traefik_enabled: false
        keycloak_database_type: postgres
        keycloak_environment_variable_kc_bootstrap_admin_username: username
        keycloak_environment_variable_kc_bootstrap_admin_password: password

        # Variables required for MediaWiki to connect to the Postgres database
        keycloak_database_hostname: "{{ postgres_connection_hostname }}"
        keycloak_database_port: "{{ postgres_connection_port }}"
        keycloak_database_username: my_database_username
        keycloak_database_password: my_database_password
        keycloak_database_name: keycloak
        keycloak_systemd_required_services_list_auto: |
          {{
            (['postgres.service'])
          }}

        # Variables for Postgres
        postgres_uid: 1000
        postgres_gid: 1000
        postgres_connection_password: postgres_password
        postgres_container_network: "{{ keycloak_container_network }}"
        postgres_managed_databases: |
          {{
            [{
              'name': keycloak_database_name,
              'username': keycloak_database_username,
              'password': keycloak_database_password,
            }]
          }}
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
scenario:
  # See: https://docs.ansible.com/projects/molecule/configuration/?h=test_sequence#scenario
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    # Disable idempotence test for now due to ansible-role-postgres
    # - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: ansible
